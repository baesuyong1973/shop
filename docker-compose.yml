services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: laravel_app
    volumes:
      - ./src:/var/www/html
      # `vendor` has thousands of small files; keeping it on a native Docker
      # volume instead of the Windows bind mount avoids the severe NTFS<->WSL2
      # I/O penalty that made every request take 10+ seconds in dev.
      - vendor_data:/var/www/html/vendor
      # PCOV (code coverage) is built into the image but only loaded in dev.
      - ./docker/php/pcov.ini:/usr/local/etc/php/conf.d/pcov.ini
    working_dir: /var/www/html
    depends_on:
      - db
      - redis

  # Separate app server for Playwright E2E tests (e2e/), backed by its own
  # database so test runs never touch dev data. Started on demand by the
  # E2E global setup: `docker compose --profile e2e up -d e2e`.
  # Uses PHP's built-in server directly rather than `artisan serve`, which
  # strips non-allowlisted env vars (e.g. DB_DATABASE) from its worker process.
  e2e:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: laravel_e2e
    profiles: ["e2e"]
    volumes:
      - ./src:/var/www/html
      - vendor_data:/var/www/html/vendor
    working_dir: /var/www/html
    environment:
      APP_URL: http://localhost:8090
      DB_DATABASE: laravel_e2e
      # Serve the assets built by the E2E global setup rather than the Vite
      # dev server (a file that never exists, so public/hot is ignored).
      VITE_HOT_FILE: /var/www/html/storage/framework/e2e-no-vite-hot
      # Orders take their deposit through the local stand-in for PayPay.
      PAYMENT_DRIVER: fake
      # Browsers hold keep-alive connections open, and each built-in server
      # worker serves one connection at a time, so allow plenty of workers.
      PHP_CLI_SERVER_WORKERS: "16"
    # OPcache is off for the CLI by default; without it every request
    # recompiles the whole framework from the slow Windows bind mount.
    command: sh -c "cd public && php -d opcache.enable_cli=1 -S 0.0.0.0:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"
    ports:
      - "8090:8000"
    depends_on:
      - db
      - redis
      - mailpit

  web:
    image: nginx:1.27-alpine
    container_name: laravel_web
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: laravel_db
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    ports:
      - "3306:3306"

  redis:
    image: redis:7-alpine
    container_name: laravel_redis
    ports:
      - "6379:6379"

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: laravel_phpmyadmin
    environment:
      PMA_HOST: db
      PMA_USER: laravel
      PMA_PASSWORD: secret
    ports:
      - "8081:80"
    depends_on:
      - db

  mailpit:
    image: axllent/mailpit:latest
    container_name: laravel_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  vite:
    image: node:20-alpine
    container_name: laravel_vite
    working_dir: /var/www/html
    environment:
      # Docker Desktop on Windows doesn't reliably forward filesystem change
      # events into the container for bind-mounted volumes, so chokidar's
      # native watcher can miss edits made from the host. Force polling.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    volumes:
      - ./src:/var/www/html
      - vite_node_modules:/var/www/html/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped

volumes:
  db_data:
  vite_node_modules:
  vendor_data:
